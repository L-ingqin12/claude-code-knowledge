# ============================================================
# nginx.conf — Windows 版 (Pi Agent 后端)
# 部署路径: C:\nginx\conf\nginx.conf
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format timed '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     'rt=$request_time '
                     'uct="$upstream_connect_time" '
                     'uht="$upstream_header_time" '
                     'urt="$upstream_response_time" '
                     'req_id="$http_x_request_id"';

    access_log logs/access.log timed buffer=64k flush=5s;
    error_log  logs/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    proxy_buffer_size       4k;
    proxy_buffers           8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;
    proxy_temp_path         temp/proxy;

    # ── 上游: Pi Agent Node.js Workers ──
    upstream pi_agent_backend {
        least_conn;
        server 127.0.0.1:8801 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8802 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8803 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8804 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50m;
        client_body_timeout 60s;
        client_header_timeout 10s;
        client_body_buffer_size 128k;

        limit_conn conn_limit 20;

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://pi_agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        location / {
            return 200 '{"service":"log-analysis-agent-pi","engine":"pi-agent","version":"1.0"}';
            add_header Content-Type application/json;
        }
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}

# ============================================================
# nginx.conf — Windows 版
# 日志分析 Agent 服务 — Nginx 反向代理 + 负载均衡
# 部署路径: C:\nginx\conf\nginx.conf
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    # Windows 不支持 epoll/kqueue，使用默认 select 模型
    # 虽然 select 有 64 socket 限制，但 nginx 内部通过
    # 多个 worker 进程分散连接压力
    worker_connections 8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── 日志格式 (含分析耗时) ──
    log_format timed '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time '
                     'uct="$upstream_connect_time" '
                     'uht="$upstream_header_time" '
                     'urt="$upstream_response_time" '
                     'req_id="$http_x_request_id"';

    access_log logs/access.log timed buffer=64k flush=5s;
    error_log  logs/error.log warn;

    # ── 基础性能 ──
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # ── 代理缓冲 (小响应直接缓冲在内存) ──
    proxy_buffer_size       4k;
    proxy_buffers           8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;
    proxy_temp_path         temp/proxy;

    # ── 上游定义 ──
    upstream tornado_backend {
        # 算法: least_conn — 日志分析耗时不一，避免请求堆积到慢 worker
        least_conn;

        # 健康检查: 连续 3 次失败后标记 down，30s 后重试
        server [IP已脱敏]:8801 weight=1 max_fails=3 fail_timeout=30s;
        server [IP已脱敏]:8802 weight=1 max_fails=3 fail_timeout=30s;
        server [IP已脱敏]:8803 weight=1 max_fails=3 fail_timeout=30s;
        server [IP已脱敏]:8804 weight=1 max_fails=3 fail_timeout=30s;

        # 到后端的 keepalive 连接池 (减少 TCP 握手开销)
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # ── 限流区域 (防止单客户端过度请求) ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── 上游超时探测 ──
    # 用于预热 upstream 连接，减少首个请求的延迟
    upstream_preheat {
        server [IP已脱敏]:8801;
        server [IP已脱敏]:8802;
        server [IP已脱敏]:8803;
        server [IP已脱敏]:8804;
        keepalive 32;
    }

    # ── 虚拟主机 ──
    server {
        listen 80;
        server_name localhost;

        # 最大请求体 (日志上传大小限制)
        client_max_body_size 50m;
        client_body_timeout 60s;
        client_header_timeout 10s;
        client_body_buffer_size 128k;

        # 单客户端并发连接上限
        limit_conn conn_limit 20;

        # ── API 路由 ──
        location /api/ {
            # 限流
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://tornado_backend;

            # HTTP/1.1 + keepalive 到后端
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 透传头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            # ── 三层超时体系 ──
            # L1: 连接后端超时 (短)
            proxy_connect_timeout 3s;
            # L2: 发送请求到后端超时
            proxy_send_timeout 30s;
            # L3: 等待后端响应超时 (长 — 日志分析可能耗时)
            proxy_read_timeout 120s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # 错误时尝试下一台
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # ── 静态资源 (如有前端界面) ──
        location /static/ {
            alias html/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── 根路径 ──
        location / {
            return 200 '{"service":"log-analysis-agent","version":"1.0"}';
            add_header Content-Type application/json;
        }
    }

    # ── 状态页 (仅本地访问) ──
    server {
        listen [IP已脱敏]:8080;
        server_name localhost;

        location /nginx_status {
            stub_status;
            allow [IP已脱敏];
            deny all;
        }

        location /upstream_status {
            # 自定义 upstream 状态 (需要 nginx-plus 或 Lua)
            return 200 '{"upstream":"tornado_backend","servers":["[IP已脱敏]:8801","[IP已脱敏]:8802","[IP已脱敏]:8803","[IP已脱敏]:8804"]}';
            add_header Content-Type application/json;
        }
    }
}
